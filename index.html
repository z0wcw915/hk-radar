<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HKT to HKO Radar URL Converter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
    }

    h1 { font-size: 1.25rem; margin-bottom: 16px; text-align: center; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    label { font-size: 0.875rem; color: var(--text-muted); }

    input[type="datetime-local"] {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
    }

    .output-box {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .radar-viewport {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .radar-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>HKT to HKO Radar URL Converter</h1>

    <div class="input-group">
      <label for="hktInput">Select Date & Time in HKT (UTC+8):</label>
      <input type="datetime-local" id="hktInput" onchange="convertHktToHkoUrl()">
    </div>

    <div class="output-box" id="urlDisplay">Select a date/time above...</div>

    <div class="radar-viewport">
      <img id="radarImg" alt="Radar Output" />
    </div>
  </div>

  <script>
    const RADAR_DIR = "https://www.hko.gov.hk/wxinfo/radars/rad_064_png/";

    function hktToUtcFilename(hktDate) {
      // Round HKT time down to the nearest 6-minute boundary (360,000 ms)
      const sixMinutesMs = 6 * 60 * 1000;
      const roundedMs = Math.floor(hktDate.getTime() / sixMinutesMs) * sixMinutesMs;
      const roundedDate = new Date(roundedMs);

      // Extract UTC parts (subtracts 8 hours automatically from local HKT)
      const YYYY = roundedDate.getUTCFullYear();
      const MM = String(roundedDate.getUTCMonth() + 1).padStart(2, '0');
      const DD = String(roundedDate.getUTCDate()).padStart(2, '0');
      const HH = String(roundedDate.getUTCHours()+8).padStart(2, '0');
      const mm = String(roundedDate.getUTCMinutes()).padStart(2, '0');
      let HKT = Number(HH) ;
      console.log(HKT);
      if( HKT >  24){ 
        HKT = Number(HH) - 24
        return `2d064nradar_${YYYY}${MM}${DD}${String(HKT)}${mm}.jpg`;
      }else {
        return `2d064nradar_${YYYY}${MM}${DD}${HH}${mm}.jpg`;
      }
    }
    function convertHktToHkoUrl() {
      const inputVal = document.getElementById("hktInput").value;
      if (!inputVal) return;

      // Create Date object assuming local HKT input
      const hktDate = new Date(inputVal);
      console.log(hktDate);
      // Generate the HKO UTC filename
      const filename = hktToUtcFilename(hktDate);
      const fullUrl = `${RADAR_DIR}${filename}`;
      console.log(fullUrl);
      // Update UI
      document.getElementById("urlDisplay").textContent = fullUrl;
      document.getElementById("radarImg").src = fullUrl;
    }

    // Set default input value to current time rounded down to 6 minutes
    const now = new Date();
    const roundedNow = new Date(Math.floor(now.getTime() / (6 * 60 * 1000)) * (6 * 60 * 1000));
    
    // Format to YYYY-MM-THH:mm for datetime-local input
    const localIso = new Date(roundedNow.getTime() - (roundedNow.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
    document.getElementById("hktInput").value = localIso;
    
    // Run initial conversion
    convertHktToHkoUrl();
  </script>

</body>
</html>
