<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hong Kong Rain Radar (64 km)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .radar-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radar-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .status-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .controls {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 12px;
    }

    .info-group {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .info-group span {
      color: var(--text-main);
      font-weight: 500;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: var(--border-color);
      color: var(--text-main);
    }

    footer {
      padding: 16px 20px;
      background-color: rgba(15, 23, 42, 0.4);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border-color);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hong Kong Rain Radar</h1>
      <p class="subtitle">64 km Range (3 km Height Cut)</p>
    </header>

    <div class="radar-viewport">
      <div class="status-overlay">
        <div class="status-dot"></div>
        <span id="feedStatus">Live Feed</span>
      </div>
      <img id="radarImg" alt="HKO 64km Radar Imagery" />
    </div>

    <div class="controls">
      <div class="info-group">
        Frame Time: <span id="updateTime">Updating...</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="prevFrame()">◀ Prev</button>
        <button class="btn btn-secondary" onclick="togglePlay()" id="playBtn">▶ Play</button>
        <button class="btn btn-secondary" onclick="nextFrame()">Next ▶</button>
        <button class="btn" onclick="syncFrames()">Refresh</button>
      </div>
    </div>

    <footer>
      Data provided by <a href="https://www.hko.gov.hk/en/wxinfo/radars/radar_range1.htm" target="_blank" rel="noopener">Hong Kong Observatory</a>. Auto-updates every 6 minutes.
    </footer>
  </div>

  <script>
    const RADAR_DIR = "https://www.hko.gov.hk/wxinfo/radars/rad_064_png/";
    const SIX_MINUTES_MS = 6 * 60 * 1000;
    const MAX_FRAMES = 10;

    let frameSequence = [];
    let currentIndex = 0;
    let playInterval = null;

    function buildFrameList() {
      const now = new Date();
      
      // 2-minute buffer for server upload delay
      const bufferMs = 2 * 60 * 1000;
      const latestTime = new Date(now.getTime() - bufferMs);
      
      // Align to nearest 6-minute interval
      const roundedLatest = new Date(Math.floor(latestTime.getTime() / SIX_MINUTES_MS) * SIX_MINUTES_MS);

      const frames = [];
      
      for (let i = MAX_FRAMES - 1; i >= 0; i--) {
        const frameDate = new Date(roundedLatest.getTime() - (i * SIX_MINUTES_MS));
        
        // 1. UTC Timestamp for HKO Image URL
        const YYYY = frameDate.getUTCFullYear();
        const MM = String(frameDate.getUTCMonth() + 1).padStart(2, '0');
        const DD = String(frameDate.getUTCDate()).padStart(2, '0');
        const HH = String(frameDate.getUTCHours()).padStart(2, '0');
        const mm = String(frameDate.getUTCMinutes()).padStart(2, '0');

        // 2. Local Display Time (HKT / UTC+8)
        const formattedHKT = frameDate.toLocaleTimeString('en-HK', {
          timeZone: 'Asia/Hong_Kong',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });

        frames.push({
          url: `${RADAR_DIR}2d064nradar_${YYYY}${MM}${DD}${HH+8}${mm}.jpg`,
          displayTime: `${formattedHKT} HKT`
        });
      }

      return frames;
    }

    function renderCurrentFrame() {
      if (frameSequence.length === 0) return;
      const frame = frameSequence[currentIndex];
      
      const imgElement = document.getElementById("radarImg");
      const timeElement = document.getElementById("updateTime");
      const statusElement = document.getElementById("feedStatus");

      imgElement.src = frame.url;
      timeElement.textContent = frame.displayTime;

      if (currentIndex === frameSequence.length - 1) {
        statusElement.textContent = "Live Feed";
      } else {
        statusElement.textContent = `History (${currentIndex + 1}/${frameSequence.length})`;
      }
    }

    function syncFrames() {
      frameSequence = buildFrameList();
      currentIndex = frameSequence.length - 1;
      renderCurrentFrame();
    }

    function prevFrame() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCurrentFrame();
      }
    }

    function nextFrame() {
      if (currentIndex < frameSequence.length - 1) {
        currentIndex++;
        renderCurrentFrame();
      }
    }

    function togglePlay() {
      const playBtn = document.getElementById("playBtn");
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        playBtn.textContent = "▶ Play";
      } else {
        playBtn.textContent = "⏸ Pause";
        playInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % frameSequence.length;
          renderCurrentFrame();
        }, 800);
      }
    }

    // Load initial frames
    syncFrames();

    // Check every 6 minutes to pop oldest frame and append newest
    setInterval(syncFrames, SIX_MINUTES_MS);
  </script>

</body>
</html>
